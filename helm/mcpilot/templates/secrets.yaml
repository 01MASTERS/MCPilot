apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpilot.fullname" . }}-secrets
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.secrets.mariadbRootPassword | quote }}
  mariadb-password: {{ .Values.secrets.mariadbPassword | quote }}
  wp-admin-password: {{ .Values.secrets.wpAdminPassword | quote }}
