{{- if and .Values.mcpServers .Values.mcpServers.woocommerce .Values.mcpServers.woocommerce.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpilot.fullname" . }}-woocommerce-mcp
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  type: {{ .Values.mcpServers.woocommerce.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.mcpServers.woocommerce.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "mcpilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woocommerce-mcp
{{- end }}
