apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcpServers.woocommerce.secretName | default "mcpilot-wc-api" }}
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  consumer_key: {{ .Values.secrets.wcConsumerKey | default "ck_demo_key_mcpilot" | quote }}
  consumer_secret: {{ .Values.secrets.wcConsumerSecret | default "cs_demo_secret_mcpilot" | quote }}
