{{- if and .Values.mcpServers .Values.mcpServers.analytics .Values.mcpServers.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpilot.fullname" . }}-analytics-mcp
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcpilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: analytics-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcpilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: analytics-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: analytics-mcp
          image: "{{ .Values.mcpServers.analytics.image.repository }}:{{ .Values.mcpServers.analytics.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServers.analytics.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "{{ .Values.mcpServers.analytics.service.port | default 3001 }}"
            - name: WORDPRESS_URL
              value: "http://{{ include "mcpilot.fullname" . }}-wordpress:80"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpServers.analytics.secretName | default "mcpilot-wc-api" }}
                  key: consumer_key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpServers.analytics.secretName | default "mcpilot-wc-api" }}
                  key: consumer_secret
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcpServers.analytics.resources | nindent 12 }}
{{- end }}
