{{- if and .Values.store.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcpilot.fullname" . }}-store-ingress
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if and .Values.ingress.store.tls (eq .Values.ingress.store.tls.enabled true) }}
  tls:
    - hosts:
        - {{ .Values.ingress.store.host | quote }}
      secretName: {{ .Values.ingress.store.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcpilot.fullname" . }}-wordpress
                port:
                  number: {{ .Values.store.wordpress.service.port }}
{{- end }}
