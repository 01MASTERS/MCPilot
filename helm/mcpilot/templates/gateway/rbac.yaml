{{- if and .Values.gateway .Values.gateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpilot.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcpilot.fullname" . }}-gateway-provisioner
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-provisioner
rules:
  # Least-Privilege Multi-Store Provisioning permissions (SEC-02, BONUS-02)
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources:
      - resourcequotas
      - limitranges
      - secrets
      - persistentvolumeclaims
      - services
      - pods
      - pods/status
      - configmaps
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcpilot.fullname" . }}-gateway-provisioner-binding
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "mcpilot.fullname" . }}-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "mcpilot.fullname" . }}-gateway-provisioner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
