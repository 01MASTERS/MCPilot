{{- if and .Values.gateway .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpilot.fullname" . }}-gateway
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.gateway.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "mcpilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
{{- end }}
