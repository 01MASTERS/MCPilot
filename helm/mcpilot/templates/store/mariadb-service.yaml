{{- if .Values.store.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpilot.fullname" . }}-mariadb
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: {{ .Values.store.mariadb.service.type }}
  ports:
    - port: {{ .Values.store.mariadb.service.port }}
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app.kubernetes.io/name: {{ include "mcpilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mariadb
{{- end }}
