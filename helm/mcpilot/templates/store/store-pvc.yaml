{{- if and .Values.store.enabled .Values.store.wordpress.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcpilot.fullname" . }}-wordpress-data
  labels:
    {{- include "mcpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  accessModes:
    - {{ .Values.store.wordpress.persistence.accessMode | quote }}
  {{- if .Values.store.wordpress.persistence.storageClass }}
  storageClassName: {{ .Values.store.wordpress.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.wordpress.persistence.size | quote }}
{{- end }}
