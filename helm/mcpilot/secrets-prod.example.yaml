# secrets-prod.example.yaml
# Template for production Kubernetes Secrets (INFRA-06)
# DO NOT COMMIT REAL SECRETS TO GIT. Generate via: bash scripts/generate-prod-secrets.sh

apiVersion: v1
kind: Secret
metadata:
  name: mcpilot-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: mcpilot
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Strong 32+ character passwords
  mariadb-root-password: "CHANGE_ME_PRODUCTION_MARIADB_ROOT_PASS"
  mariadb-password: "CHANGE_ME_PRODUCTION_WORDPRESS_DB_PASS"
  wp-admin-password: "CHANGE_ME_PRODUCTION_WORDPRESS_ADMIN_PASS"
  jwt-secret: "CHANGE_ME_PRODUCTION_JWT_SECRET_KEY_MIN_32_BYTES"
  wc-consumer-key: "ck_CHANGE_ME_PRODUCTION_WC_CONSUMER_KEY"
  wc-consumer-secret: "cs_CHANGE_ME_PRODUCTION_WC_CONSUMER_SECRET"
